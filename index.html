<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Xperience Music · Connexion</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #F4F3FA; padding: 24px;
    background: radial-gradient(ellipse 90% 45% at 50% 18%, rgba(109,91,255,.28), rgba(11,10,20,0) 70%), #0B0A14;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .word { font-weight: 900; font-size: 30px; letter-spacing: .04em; margin-top: 18px; }
  .music { font-weight: 600; font-size: 18px; letter-spacing: .62em; margin-left: .62em;
    background: linear-gradient(90deg,#B46CFF,#6D5BFF,#3D7BFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .code { font-size: 40px; font-weight: 800; letter-spacing: .3em; margin: 36px 0 6px; }
  .hint { color: #A9A6BD; font-size: 15px; line-height: 1.5; }
  .open {
    display: block; margin-top: 28px; padding: 18px; border-radius: 16px; text-decoration: none;
    color: white; font-weight: 600; font-size: 18px;
    background: linear-gradient(90deg,#B46CFF,#6D5BFF,#3D7BFF);
  }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <svg width="120" height="120" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs>
      <linearGradient id="xm" gradientUnits="userSpaceOnUse" x1="480" y1="180" x2="900" y2="760">
        <stop offset="0" stop-color="#B46CFF"/><stop offset=".5" stop-color="#6D5BFF"/><stop offset="1" stop-color="#3D7BFF"/>
      </linearGradient>
      <clipPath id="top"><rect x="0" y="267" width="1000" height="733"/></clipPath>
    </defs>
    <g transform="translate(-42 20)">
      <path d="M150 700 L420 300 M150 300 L420 700" stroke="#F4F3FA" stroke-width="96"/>
      <path d="M505 700 L505 300 L640 500 L775 300" fill="none" stroke="url(#xm)" stroke-width="92" stroke-miterlimit="10" clip-path="url(#top)"/>
      <rect x="729" y="200" width="92" height="470" fill="url(#xm)"/>
      <path d="M805 215 C845 270 935 310 885 400" fill="none" stroke="url(#xm)" stroke-width="56" stroke-linecap="round"/>
      <ellipse cx="708" cy="678" rx="100" ry="70" fill="url(#xm)" transform="rotate(-24 708 678)"/>
    </g>
  </svg>
  <div class="word">XPERIENCE</div>
  <div class="music">MUSIC</div>

  <div id="ok" class="hidden">
    <div class="code" id="code"></div>
    <p class="hint">Ton code de connexion. Touche le bouton pour l'utiliser dans l'app.</p>
    <a class="open" id="open" href="#">Ouvrir Xperience Music</a>
    <p class="hint" style="margin-top:20px">Si l'app ne s'ouvre pas, tape ce code dans l'écran de connexion.</p>
  </div>
  <p id="bad" class="hint hidden" style="margin-top:32px">Ce lien est incomplet. Utilise le code à 6 chiffres reçu par e-mail.</p>
</main>
<script>
  // The e-mail and the code travel after "#": that part never leaves the phone.
  var params = new URLSearchParams(location.hash.slice(1));
  var email = (params.get("email") || "").trim();
  var code = (params.get("code") || "").trim();
  if (/^\d{4,10}$/.test(code) && email.indexOf("@") > 0) {
    var query = "email=" + encodeURIComponent(email) + "&code=" + code;
    var isAndroid = /Android/i.test(navigator.userAgent);
    // Android: an intent link opens the app even from Gmail's built-in browser.
    var appLink = isAndroid
      ? "intent://connexion?" + query + "#Intent;scheme=xperiencemusic;package=com.xperiencemusic.app;end"
      : "xperiencemusic://connexion?" + query;
    document.getElementById("code").textContent = code;
    document.getElementById("open").href = appLink;
    document.getElementById("ok").classList.remove("hidden");
    // Clear the code from the address bar and history once read.
    history.replaceState(null, "", location.pathname);
  } else {
    document.getElementById("bad").classList.remove("hidden");
  }
</script>
</body>
</html>
